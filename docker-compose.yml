# Execução local completa: `docker compose up -d --build` → http://localhost:8080
# Só o banco (para rodar API/front fora do Docker): `docker compose up -d postgres`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
    ports:
      - "127.0.0.1:5470:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      ConnectionStrings__Catalogo: "Host=postgres;Database=catalogo;Username=catalogo;Password=catalogo"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
